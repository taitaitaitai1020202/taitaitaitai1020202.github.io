<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新元素づくりゲーム</title>
<style>
:root{color-scheme:dark;--bg:#10131d;--panel:#191f2d;--line:#343e53;--text:#eef2ff;--muted:#aab4ca;--accent:#83e1c1}
*{box-sizing:border-box}
body{margin:0;padding:28px 16px 50px;color:var(--text);background:radial-gradient(ellipse at top,#27334a,transparent 55%),var(--bg);font:16px/1.55 system-ui,sans-serif}
main{max-width:1100px;margin:auto}h1{margin:0 0 5px;font-size:clamp(2rem,6vw,3.2rem)}h2{margin:0 0 16px}p{color:var(--muted)}
.panel{margin-bottom:22px;padding:20px;border:1px solid var(--line);border-radius:18px;background:#191f2df2;box-shadow:0 12px 35px #0003}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
label{display:block;font-weight:650}input,textarea{display:block;width:100%;margin-top:6px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#111723;color:var(--text);font:inherit}
textarea{min-height:76px;resize:vertical}.full{grid-column:1/-1}
.actions,.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:16px}
button{padding:10px 14px;border:0;border-radius:10px;background:var(--accent);color:#10211d;font:inherit;font-weight:800;cursor:pointer}
button.secondary{border:1px solid var(--line);background:#20283a;color:var(--text)}
.toolbar{justify-content:space-between;margin:0 0 16px}.toolbar h2{margin:0}.toolbar input{max-width:360px;margin:0}
.count,.note{color:var(--muted);font-size:.9rem}
.elements{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.element{min-height:175px;padding:14px;border:1px solid var(--line);border-top:4px solid #78849b;border-radius:15px;background:linear-gradient(145deg,#222b3d,#171d2a);overflow-wrap:anywhere}
.element.fictional{border-top-color:var(--accent)}.topline{display:flex;justify-content:space-between;gap:8px}
.atomic,.type{color:var(--muted);font-size:.82rem}.symbol{font-size:2rem;line-height:1.1;font-weight:900}
.element h3{margin:9px 0 2px;font-size:1.08rem}.family{color:var(--accent);font-size:.85rem}
.density{margin:7px 0;color:#ffe49b;font-size:.88rem}.feature{margin:7px 0;font-size:.9rem}
.origin{margin:6px 0 0;color:var(--muted);font-size:.82rem}
.card-buttons{display:flex;gap:5px}.card-buttons button{padding:5px 8px;font-size:.78rem}
.card-buttons .delete{border:1px solid #75434b;background:transparent;color:#ff9c9c}
@media(max-width:620px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.panel{padding:16px}}
</style>
</head>
<body>
<main>
<h1>新元素づくりゲーム</h1>
<p>実在元素も、みんなで考えた元素も、まとめて自分の周期表にしよう。</p>

<section class="panel">
<h2 id="formTitle">元素を追加</h2>
<form id="elementForm">
<div class="grid">
<label>元素名<input id="name" required maxlength="40" placeholder="例：ハルシン"></label>
<label>元素記号<input id="symbol" required maxlength="3" pattern="[A-Za-z]{1,3}" placeholder="例：Hn"></label>
<label>原子番号<input id="number" type="number" min="1" step="1" required></label>
<label>族・分類<input id="family" maxlength="40" placeholder="例：ハルシノイド"></label>
<label>密度（g/cm³）<input id="density" type="number" min="0" step="any" placeholder="任意"></label>
<label>名前の由来<input id="origin" maxlength="120" placeholder="任意"></label>
<label class="full">特徴<textarea id="feature" maxlength="500" placeholder="性質や用途など"></textarea></label>
</div>
<div class="actions">
<button id="submitButton" type="submit">元素を追加</button>
<button id="cancelEdit" class="secondary" type="button" hidden>編集をキャンセル</button>
<button id="resetButton" class="secondary" type="button">初期状態に戻す</button>
</div>
<p class="note">原子番号と元素記号は、ほかの元素と重複できません。</p>
</form>
</section>

<section class="panel">
<div class="toolbar">
<h2>元素一覧</h2>
<input id="search" type="search" placeholder="名前・記号・番号・族で検索">
<span id="count" class="count"></span>
</div>
<div id="status" class="note"></div>
<div id="elements" class="elements"></div>
</section>
</main>

<script type="module">
const realData = `
1|H|水素
2|He|ヘリウム
3|Li|リチウム
4|Be|ベリリウム
5|B|ホウ素
6|C|炭素
7|N|窒素
8|O|酸素
9|F|フッ素
10|Ne|ネオン
11|Na|ナトリウム
12|Mg|マグネシウム
13|Al|アルミニウム
14|Si|ケイ素
15|P|リン
16|S|硫黄
17|Cl|塩素
18|Ar|アルゴン
19|K|カリウム
20|Ca|カルシウム
21|Sc|スカンジウム
22|Ti|チタン
23|V|バナジウム
24|Cr|クロム
25|Mn|マンガン
26|Fe|鉄
27|Co|コバルト
28|Ni|ニッケル
29|Cu|銅
30|Zn|亜鉛
31|Ga|ガリウム
32|Ge|ゲルマニウム
33|As|ヒ素
34|Se|セレン
35|Br|臭素
36|Kr|クリプトン
37|Rb|ルビジウム
38|Sr|ストロンチウム
39|Y|イットリウム
40|Zr|ジルコニウム
41|Nb|ニオブ
42|Mo|モリブデン
43|Tc|テクネチウム
44|Ru|ルテニウム
45|Rh|ロジウム
46|Pd|パラジウム
47|Ag|銀
48|Cd|カドミウム
49|In|インジウム
50|Sn|スズ
51|Sb|アンチモン
52|Te|テルル
53|I|ヨウ素
54|Xe|キセノン
55|Cs|セシウム
56|Ba|バリウム
57|La|ランタン
58|Ce|セリウム
59|Pr|プラセオジム
60|Nd|ネオジム
61|Pm|プロメチウム
62|Sm|サマリウム
63|Eu|ユウロピウム
64|Gd|ガドリニウム
65|Tb|テルビウム
66|Dy|ジスプロシウム
67|Ho|ホルミウム
68|Er|エルビウム
69|Tm|ツリウム
70|Yb|イッテルビウム
71|Lu|ルテチウム
72|Hf|ハフニウム
73|Ta|タンタル
74|W|タングステン
75|Re|レニウム

78|Pt|白金
79|Au|金
80|Hg|水銀
81|Tl|タリウム

83|Bi|ビスマス
84|Po|ポロニウム
85|At|アスタチン
86|Rn|ラドン
87|Fr|フランシウム
88|Ra|ラジウム
89|Ac|アクチニウム
90|Th|トリウム
91|Pa|プロトアクチニウム
92|U|ウラン
93|Np|ネプツニウム
94|Pu|プルトニウム
95|Am|アメリシウム
96|Cm|キュリウム
97|Bk|バークリウム
98|Cf|カリホルニウム
99|Es|アインスタイニウム
100|Fm|フェルミウム
101|Md|メンデレビウム
102|No|ノーベリウム
103|Lr|ローレンシウム
104|Rf|ラザホージウム
105|Db|ドブニウム
106|Sg|シーボーギウム
107|Bh|ボーリウム
108|Hs|ハッシウム
109|Mt|マイトネリウム
110|Ds|ダームスタチウム
111|Rg|レントゲニウム
112|Cn|コペルニシウム
113|Nh|ニホニウム
114|Fl|フレロビウム
115|Mc|モスコビウム
116|Lv|リバモリウム
117|Ts|テネシン
118|Og|オガネソン
`.trim();

const fictionalElements = [
[119,"Hn","ハルシン","ハルシノイド",0.0012,"結晶が光を屈折させ、別の景色のような像を見せる。",""],
[120,"Mj","ミラジウム","ハルシノイド",0.0020,"結晶面に、物体の少し違う姿を映す。",""],
[121,"Ub","ウンブラル","ハルシノイド",0.0006,"周囲に輪郭だけの影の像を作る。",""],
[122,"Sy","ソムネリウム","ハルシノイド",0.0030,"光の残像を淡く長く残す。",""],
[123,"Hr","ホルシアン","ハルシノイド",0.15,"光の変化を捉え、周囲の像を結晶面に映す。","ホルスに由来"],
[124,"Kd","カルディン","ハルシノイド",1.86,"金属元素。その化合物の結晶は光を二方向に分ける。",""],
[125,"Aq","アーコシン","アコーストイド",3.4,"結晶の向きによって振動の伝わり方が変わる。",""],
[126,"So","ソノリウム","アコーストイド",2.65,"振動が内部で弱まりにくく、よく伝える。","「ソノ」から"],
[127,"Ec","エコリウム","アコーストイド",3.10,"多孔質の結晶を作り、特定の音域で響く。","「エコー」から"],
[128,"Rz","レゾニウム","アコーストイド",4.20,"特定の振動数で共鳴しやすい。","「レゾナンス」から"],
[129,"Dp","ダンピウム","アコーストイド",5.30,"振動を熱に変えて弱めやすい。","「ダンピング」から"],
[130,"Sv","ソルガレン","アコーストイド",4.70,"層状結晶が特定の振動を弱める。","solから"],
[131,"Tn","タンビア","アコーストイド",2.90,"化合物の結晶が圧力や振動を微弱な電圧に変える。","音色と振動のイメージから"]
].map(([number,symbol,name,family,density,feature,origin])=>({
 id:`fiction-${number}`,number,symbol,name,family,density,feature,origin,kind:"fictional"
}));

const propertyMap = new Map();
let dataMessage = "実在元素の密度・特徴を読み込み中…";
try {
 const response = await fetch("https://raw.githubusercontent.com/Bowserinator/Periodic-Table-JSON/master/PeriodicTableJSON.json");
 if (!response.ok) throw new Error("取得できませんでした");
 const json = await response.json();
 for (const e of json.elements) {
   propertyMap.set(Number(e.number), {
     density: e.density ?? null,
     feature: e.summary || e.appearance || "詳しい特徴データはありません。"
   });
 }
 dataMessage = "実在元素の密度・特徴を読み込みました。";
} catch {
 dataMessage = "密度・特徴を取得できませんでした。インターネット接続を確認してください。";
}

const realElements = realData.split("\n").map(line=>{
 const [n,symbol,name]=line.split("|");
 const number=Number(n), p=propertyMap.get(number)||{};
 return {id:`real-${number}`,number,symbol,name,family:"実在元素",
   density:p.density,feature:p.feature||"",origin:"",kind:"real"};
});
const initialElements=[...realElements,...fictionalElements];
const storageKey="elementGame_v3";
let elements=[];
let editingId=null;

try {
 const saved=JSON.parse(localStorage.getItem(storageKey)||"null");
 if(Array.isArray(saved)){
   const base=new Map(initialElements.map(e=>[e.id,e]));
   elements=saved.map(e=>{
     const real=base.get(e.id);
     return real ? {...real,...e,density:e.density??real.density,feature:e.feature||real.feature} : e;
   });
 } else {
   elements=structuredClone(initialElements);
 }
} catch {
 elements=structuredClone(initialElements);
}

const form=document.getElementById("elementForm");
const list=document.getElementById("elements");
const search=document.getElementById("search");
const numberInput=document.getElementById("number");
document.getElementById("status").textContent=dataMessage;

function esc(value){
 return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function save(){localStorage.setItem(storageKey,JSON.stringify(elements));}
function nextNumber(){return Math.max(118,...elements.map(e=>Number(e.number)||0))+1;}

function render(){
 const q=search.value.trim().toLowerCase();
 const filtered=[...elements].sort((a,b)=>a.number-b.number).filter(e=>
   `${e.number} ${e.name} ${e.symbol} ${e.family}`.toLowerCase().includes(q));
 document.getElementById("count").textContent=`${elements.length}元素`;
 list.innerHTML=filtered.length?filtered.map(e=>`
  <article class="element ${e.kind==="fictional"?"fictional":""}">
   <div class="topline"><div>
    <div class="atomic">${esc(e.number)}番・${e.kind==="real"?"実在":"創作"}</div>
    <div class="symbol">${esc(e.symbol)}</div>
   </div><div class="card-buttons">
    <button class="secondary" type="button" data-edit="${esc(e.id)}">編集</button>
    <button class="delete" type="button" data-delete="${esc(e.id)}">削除</button>
   </div></div>
   <h3>${esc(e.name)}</h3><div class="family">${esc(e.family||"分類なし")}</div>
   ${e.density!==null&&e.density!==""&&e.density!==undefined?`<div class="density">密度：${esc(e.density)} g/cm³</div>`:""}
   ${e.feature?`<p class="feature">${esc(e.feature)}</p>`:""}
   ${e.origin?`<p class="origin">由来：${esc(e.origin)}</p>`:""}
  </article>`).join(""):'<p>見つかりませんでした。</p>';
}
function resetForm(){
 form.reset();editingId=null;
 document.getElementById("formTitle").textContent="元素を追加";
 document.getElementById("submitButton").textContent="元素を追加";
 document.getElementById("cancelEdit").hidden=true;
 numberInput.value=nextNumber();
}
form.addEventListener("submit",event=>{
 event.preventDefault();
 const number=Number(numberInput.value);
 const name=document.getElementById("name").value.trim();
 const symbol=document.getElementById("symbol").value.trim();
 const family=document.getElementById("family").value.trim()||"分類なし";
 const d=document.getElementById("density").value.trim();
 const density=d===""?null:Number(d);
 const feature=document.getElementById("feature").value.trim();
 const origin=document.getElementById("origin").value.trim();
 if(!Number.isInteger(number)||number<1){alert("原子番号は1以上の整数にしてください。");return;}
 if(elements.some(e=>e.number===number&&e.id!==editingId)){alert("その原子番号はすでに使われています。");return;}
 if(elements.some(e=>e.symbol.toLowerCase()===symbol.toLowerCase()&&e.id!==editingId)){alert("その元素記号はすでに使われています。");return;}
 const old=elements.find(e=>e.id===editingId);
 const item={id:old?old.id:`custom-${Date.now()}`,number,name,symbol,family,density,feature,origin,kind:old?.kind||"fictional"};
 elements=editingId?elements.map(e=>e.id===editingId?item:e):[...elements,item];
 save();resetForm();render();
});
list.addEventListener("click",event=>{
 const edit=event.target.closest("[data-edit]");
 const del=event.target.closest("[data-delete]");
 if(edit){
   const e=elements.find(x=>x.id===edit.dataset.edit);if(!e)return;
   editingId=e.id;
   document.getElementById("name").value=e.name;
   document.getElementById("symbol").value=e.symbol;
   numberInput.value=e.number;
   document.getElementById("family").value=e.family||"";
   document.getElementById("density").value=e.density??"";
   document.getElementById("feature").value=e.feature||"";
   document.getElementById("origin").value=e.origin||"";
   document.getElementById("formTitle").textContent=`${e.name}を編集`;
   document.getElementById("submitButton").textContent="変更を保存";
   document.getElementById("cancelEdit").hidden=false;
   window.scrollTo({top:0,behavior:"smooth"});
 }
 if(del){
   const e=elements.find(x=>x.id===del.dataset.delete);if(!e)return;
   if(confirm(`${e.name}を削除しますか？`)){
     elements=elements.filter(x=>x.id!==e.id);
     if(editingId===e.id)resetForm();
     save();render();
   }
 }
});
document.getElementById("cancelEdit").addEventListener("click",resetForm);
document.getElementById("resetButton").addEventListener("click",()=>{
 if(!confirm("一覧を初期状態に戻しますか？編集・追加した内容は消えます。"))return;
 elements=structuredClone(initialElements);save();resetForm();render();
});
search.addEventListener("input",render);
numberInput.value=nextNumber();
render();
</script>
</body>
</html>
